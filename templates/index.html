<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دليل الحرفيين</title>
  <style>
    :root {
      --ground: #fbfbfc;
      --card:   #ffffff;
      --line:   #d8dee8;
      --ink:    #161b24;
      --muted:  #5b6472;
      --accent: #1b4d8f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #10141b;
        --card:   #191f29;
        --line:   #2e3846;
        --ink:    #e5e9f0;
        --muted:  #8a94a6;
        --accent: #7db0f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2.5rem 1.25rem 5rem;
      background: var(--ground);
      color: var(--ink);
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .col { width: min(100%, 44rem); display: flex; flex-direction: column; gap: 1rem; }
    h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
    p.sub { margin: 0; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
    @media (min-width: 34rem) { ul { grid-template-columns: 1fr 1fr; } }
    a.trade {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.9rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
    }
    a.trade:hover, a.trade:focus-visible { border-color: var(--accent); }
    a.trade:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ar { font-size: 1.05rem; font-weight: 600; }
    .en { font-size: 0.82rem; color: var(--muted); direction: ltr; }
  </style>
</head>
<body>
  <div class="col">
    <h1>دليل الحرفيين والمقاولين</h1>
    <p class="sub">اختر البند للاطلاع على المحلات المسجلة به</p>

    <ul>
      {% for t in trades %}
      <li>
        <a class="trade" href="/trades/{{ t.id }}">
          <span class="ar">{{ t.name_ar }}</span>
          <span class="en">{{ t.name_en }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
