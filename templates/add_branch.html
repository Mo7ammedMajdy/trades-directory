{% extends "base.html" %}

{% block title %}إضافة فرع جديد - دليل المحلات{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-success text-white p-3">
                <h4 class="mb-0 fw-bold">🏢 إضافة فرع جديد</h4>
            </div>
            <div class="card-body p-4">
                {% if shop_id %}
                <form action="/shops/{{ shop_id }}/add-branch" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">اسم الفرع (اختياري)</label>
                        <input type="text" name="branch_name" class="form-control" placeholder="مثال: فرع وسط البلد، فرع المعادي">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">العنوان التفصيلي <span class="text-danger">*</span></label>
                        <input type="text" name="address" class="form-control" placeholder="أدخل عنوان الفرع بالكامل" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">رقم الهاتف</label>
                        <input type="text" name="phone_number" class="form-control" placeholder="رقم للتواصل">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg fw-semibold">➕ إضافة الفرع</button>
                        <a href="/shops/{{ shop_id }}" class="btn btn-outline-secondary">← العودة للمحل</a>
                    </div>

                </form>
                {% else %}
                <div class="text-center py-4">
                    <p class="text-danger">خطأ: لم يتم تحديد المحل التابع له هذا الفرع.</p>
                    <a href="/" class="btn btn-primary btn-sm">العودة للرئيسية</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
