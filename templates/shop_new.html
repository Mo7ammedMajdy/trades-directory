<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إضافة محل — دليل الحرفيين</title>
  <style>
    body {
      margin: 0 auto;
      padding: 2rem 1rem;
      max-width: 36rem;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.6;
    }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: 0.3rem; font-weight: 600; }
    input, select, textarea, button { padding: 0.65rem; font: inherit; }
    textarea { min-height: 7rem; resize: vertical; }
    button { cursor: pointer; }
    .error { color: #a40000; }
  </style>
</head>
<body>
  <main>
    <h1>إضافة محل</h1>

    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form action="/shops" method="post">
      <label>
        الاسم بالعربية
        <input type="text" name="name_ar" required>
      </label>

      <label>
        الحرفة
        <select name="trade_id" required>
          <option value="" selected disabled>اختر الحرفة</option>
          {% for trade in trades %}
            <option value="{{ trade.id }}">{{ trade.name_ar }} — {{ trade.name_en }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        الاسم بالإنجليزية
        <input type="text" name="name_en" dir="ltr">
      </label>

      <label>
        السجل التجاري
        <input type="text" name="commercial_register">
      </label>

      <label>
        الحساب البنكي
        <input type="text" name="bank_account" dir="ltr">
      </label>

      <label>
        القدرة الفنية
        <textarea name="technical_capacity"></textarea>
      </label>

      <button type="submit">إضافة المحل</button>
    </form>
  </main>
</body>
</html>
