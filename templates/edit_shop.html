{% extends "base.html" %}

{% block title %}تعديل بيانات المحل - دليل المحلات{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-warning text-dark p-3">
                <h4 class="mb-0 fw-bold">✏️ تعديل بيانات المحل</h4>
            </div>
            <div class="card-body p-4">
                {% if shop %}
                <form action="/shops/{{ shop.id }}/edit" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">اسم المحل (بالعربية) <span class="text-danger">*</span></label>
                        <input type="text" name="name_ar" class="form-control" value="{{ shop.name_ar or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">اسم المحل (بالإنجليزية)</label>
                        <input type="text" name="name_en" class="form-control" value="{{ shop.name_en or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">السجل التجاري</label>
                        <input type="text" name="commercial_register" class="form-control" value="{{ shop.commercial_register or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">الحساب البنكي</label>
                        <input type="text" name="bank_account" class="form-control" value="{{ shop.bank_account or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">القدرة الفنية</label>
                        <input type="text" name="technical_capacity" class="form-control" value="{{ shop.technical_capacity or '' }}">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning btn-lg fw-semibold">💾 حفظ التعديلات</button>
                        <a href="/shops/{{ shop.id }}" class="btn btn-outline-secondary">← إلغاء والعودة للمحل</a>
                    </div>

                </form>
                {% else %}
                <div class="text-center py-4">
                    <p class="text-danger">عذراً، المحل المراد تعديله غير موجود.</p>
                    <a href="/" class="btn btn-primary btn-sm">العودة للرئيسية</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
