<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}دليل الحرفيين{% endblock %} — دليل الحرفيين</title>
  <!-- ?v= is a cache buster. The stylesheet was replaced wholesale at this
       URL, so browsers that had the old one held on to it. Bump the number
       whenever style.css changes in a way people must see immediately. -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=2">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">دليل الحرفيين <span>· إدارة</span></a>
    <nav class="topnav">
      <a href="/"       class="{% if nav == 'home'   %}active{% endif %}">لوحة البيانات</a>
      <a href="/trades" class="{% if nav == 'trades' %}active{% endif %}">الأقسام</a>
      <a href="/shops"  class="{% if nav == 'shops'  %}active{% endif %}">المحلات</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="foot">
  قاعدة بيانات دليل الحرفيين والأنشطة التجارية — 2026
</footer>

</body>
</html>
